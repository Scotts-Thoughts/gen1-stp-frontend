<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Scott's Thoughts - Generation 1 Overlay - v1.4.0</title>
    <link rel="stylesheet" href="style-yellow.css">
</head>
<body>
    <div id="app">
        <!-- <keyhook></keyhook> -->
        <div v-if="ready == false">
            <no_mapper></no_mapper>
        </div>
        <div v-else-if="game_name == 'Red' || game_name == 'Blue' || game_name == 'Yellow' || game_name == 'Yellow Legacy'">
            <div class="mainContainer">
                <graphics v-bind="graphicsProps"></graphics>
                
                <!-- Background Processes -->
                <enemy_state :mapper="mapper"></enemy_state>

                <!-- Left Panel -->
                <faults></faults>
                <div v-if="battlePopUps == true" style="position: absolute;">
                    <pop_ups
                        :mapper="mapper"
                        :state="state"
                        :battle_fade="battle_fade"
                    ></pop_ups>
                    
                    <bonk_counter
                        :mapper="mapper"
                        :state="state"
                        :show_bonk_counter="show_bonk_counter"
                        :blackouts_resets="blackouts_resets"
                        :dropdown_bonks_items="dropdown_bonks_items"
                    ></bonk_counter>
                    
                    <repel_counter
                        :mapper="mapper"
                        :state="state"
                        :show_repel_counter="show_repel_counter"
                        :blackouts_resets="blackouts_resets"
                    ></repel_counter>
                </div>
                <type_icons :pkmn_type="pkmn_type"></type_icons>
                <moveset
                    :starter="starterName"
                    :mapper="mapper"
                    :state="state"
                    :move_name="move_name"
                    :pokedex_data="g1PokemonData"
                    :dynamic_mon="s1dynamic"
                    :capitalization_format="capitalization_format"
                    :display_badge_boosts="display_badge_boosts"
                ></moveset>
                <stats
                    :mapper="mapper"
                    :state="state"    
                    :starter="starterName"    
                    :stats_display="stats_display"
                    :pokedex_old="g1PokemonData"
                    :pokedex_yellow="pokedex_yellow"
                    :display_badge_boosts="display_badge_boosts"
                    :dynamic_mon="s1dynamicReset"
                ></stats>   
                <!-- <exp_bar
                    :mapper="mapper"
                    :dynamic-reset="s1dynamicReset"
                    :starter-name="starterName"
                    :g1-pokemon-data="g1PokemonData"
                    :sleep="sleep"
                ></exp_bar> -->
                <badge_boosts :mapper="mapper" ></badge_boosts>
                <badges :mapper="mapper"></badges>
                <timer></timer>

                <!-- Right Panel -->
                <transition name="fade">
                    <div v-if="right_panel == 'Movepool'" key=0>
                        <movepool
                            :starter-name="starterName"
                            :pokemon_version_specific_data="pokemon_version_specific_data"
                            :dynamic-reset="s1dynamicReset"
                            :starting_type_fix="starting_type_fix"
                        ></movepool>
                    </div>
                    <div v-else-if="right_panel == 'Splits'" key=5>
                        <div key=3>
                            <div class="split_label">Splits</div>
                            <div v-if="toggle_compare_splits === 'Followup'">
                                <splits_followup
                                    :ui_type_color_modifier="ui_type_color_modifier"
                                    :starting_type_fix="starting_type_fix"
                                    :compare_splits="compare_splits"
                                    :trainer_name_lookup="trainer_name_lookup"
                                    :previous_label="previous_label"
                                    :current_label="current_label"
                                ></splits_followup>
                            </div>
                            <div v-else-if="toggle_compare_splits === 'First'">
                                <splits_first
                                    :ui_type_color_modifier="ui_type_color_modifier"
                                    :starting_type_fix="starting_type_fix"
                                    :compare_splits="compare_splits"
                                    :trainer_name_lookup="trainer_name_lookup"
                                ></splits_first>
                            </div>
                            <div v-else-if="toggle_compare_splits === 'Followup + Summary'">
                                <splits_summary v-bind="splits_summary_props"></splits_summary>
                            </div>
                        </div>
                    </div>
                    <div v-else-if="right_panel == 'Automatic' && (state != 'Base Stats' && (state == 'To Battle' || state == 'Battle') && mapper.properties.battle.type.value == `Trainer`)" style="position: absolute;" key=1>
                        <enemy_graphic
                            :mapper="mapper"
                            :ui_type_color_modifier="ui_type_color_modifier"
                            :capitalization_format="capitalization_format"
                            :move_name="move_name"
                            :speed_comparison_toggle="speed_comparison_toggle"
                            :battle_pokemon_crop="battle_pokemon_crop"
                            :get_enemy_pkmn_styles="get_enemy_pkmn_styles"
                            :enemy_pkmn_faint_types="enemy_pkmn_faint_types"
                            :g1-pokemon-data="g1PokemonData"
                            :starter-name="starterName"
                            :enemy-state="enemyState"
                            :state="state"
                            :right_panel="right_panel"
                        ></enemy_graphic>
                    </div>
                    <div v-else-if="right_panel == 'Automatic' && (state == 'Battle' || state == 'From Battle') && (mapper.properties.battle.type.value == `Wild` && show_wild_battles == true)" style="position: absolute;">
                        <wild_pokemon
                            :mapper="mapper"
                            :state="state"
                            :starter-name="starterName"
                            :g1-pokemon-data="g1PokemonData"
                            :enemy-state="enemyState"
                            :battle_pokemon_crop="battle_pokemon_crop"
                            :batt="batt"
                            :move_name="move_name"
                            :get_enemy_pkmn_styles="get_enemy_pkmn_styles"
                            :enemy_pkmn_faint_types="enemy_pkmn_faint_types"
                            :speed_comparison_toggle="speed_comparison_toggle"
                        ></wild_pokemon>
                    </div>
                    <div v-else-if="key_F14 == true" key=3>
                        <movepool
                            :starter-name="starterName"
                            :pokemon_version_specific_data="pokemon_version_specific_data"
                            :dynamic-reset="s1dynamicReset"
                            :starting_type_fix="starting_type_fix"
                        ></movepool>
                    </div>
                </transition>
            </div>

            <!-- Game-Area Panel -->
            <div class="testingArea1" style="z-index: 50000;"><interface_1></interface_1></div>
            <div class="testingArea2" style="z-index: 50000;"><interface_2></interface_2></div>
            <div class="testingArea4" style="z-index: 50000;"><interface_3></interface_3></div>
            <div class="testingArea3" style="z-index: 50000;"><interface_4></interface_4></div>
        </div>
    </div>

    <!-- Imports -->
    <script src="https://unpkg.com/@microsoft/signalr@7.0.14/dist/browser/signalr.min.js"></script> 
    <script src="packages/vue.global.js"></script>
    <script src="packages/gameHookMapperClient.js"></script>
    <script src="data/g1PokemonData.js"></script>
    <script src="data/g1PokemonDataRB.js"></script>
    <script src="data/gen1YellowTrainers.js"></script>
    <script src="data/gen1RedBlueTrainers.js"></script>
    <script src="data/settings.js"></script>
    <script src="data/saved_settings.js"></script>
    <script src="data/deprecated_autosplitter.js"></script>
    <script src="data/autosplitter.js"></script>
    <script src="data/battle_summary_properties.js"></script>
    <script src="data/pokedex/pokedex_red_blue.js"></script>
    <script src="data/pokedex/pokedex_yellow.js"></script>
    <script src="data/pokedex/pokedex_gold_silver.js"></script>
    <script src="data/pokedex/pokedex_crystal.js"></script>
    <script src="data/backports.js"></script>
    <script src="data/cross_generation_moves.js"></script>
    <script src="settings/application_settings.js"></script>
    <script src="settings/pokemon_settings.js"></script>
    <script src="settings/time_settings.js"></script>
    <script src="autosplitter/trainer_name_lookup.js"></script>
    <script src="autosplitter/split_trainers.js"></script>
    <script src="autosplitter/battle_summary.js"></script>
    <script src="autosplitter/autosplitter_functions.js"></script>
    <script src="methods/text_functions.js"></script>
    <script src="methods/splits_functions.js"></script>
    <script type="text/javascript" src="frontend.js"></script>
</body>
